[package]
name = "asciier"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Terminal viewer and converter: video, audio and images as ASCII art in the terminal theme's colours"

[dependencies]
libc = "0.2"
lexopt = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "dds", "hdr", "exr", "avif-native"] }
fast_image_resize = "6"
resvg = "0.49"
freetype-rs = "0.38"
dbus = "0.9"
dbus-crossroads = "0.5"
serde_json = "1"
flate2 = "1"

[profile.release]
lto = "thin"
strip = true
